name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Pruebas (PostgreSQL + GUI virtual)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marcacion_test
          POSTGRES_USER: marcacion
          POSTGRES_PASSWORD: marcacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marcacion -d marcacion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: marcacion_test
      DB_USER: marcacion
      DB_PASSWORD: marcacion
      # Solo para CI. Ambas son obligatorias y exigen 32+ caracteres:
      # sin ellas el proceso aborta en lugar de firmar con una clave conocida.
      JWT_SECRET_KEY: clave-de-ci-no-usar-en-produccion
      COMPROBANTE_CLAVE: clave-de-comprobantes-de-ci-no-usar-en-produccion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencias del sistema (Tkinter + pantalla virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilación de todos los módulos
        run: python -m py_compile src/*.py

      - name: Aplicar el esquema (base limpia)
        run: python src/migrate.py

      - name: Script del portal parsea (node --check)
        run: python tests/smoke_portal_js.py

      - name: Motor de liquidación · turnos frontera (Ley 213)
        run: python tests/test_motor_horario.py

      - name: Paleta · contraste WCAG y paridad web/escritorio
        run: xvfb-run -a python tests/test_paleta.py

      - name: Preparar usuarios de prueba
        run: python tests/setup_ci.py

      - name: Antifraude · condición del día declarada por RRHH (P1-1)
        run: python tests/test_condicion_dia.py

      - name: Autoservicio de permisos · ciclo completo y cuota reservada
        run: python tests/smoke_permisos_autoservicio.py

      - name: Formularios automáticos · planilla de extras y constancia
        run: python tests/test_planilla_extras.py

      - name: Turno nocturno y jornadas sin cierre (P2-2, P2-6)
        run: python tests/test_turno_nocturno.py

      - name: Antigüedad desde el contrato y baja lógica (P3-6)
        run: python tests/test_antiguedad_y_bajas.py

      - name: Biometría cifrada y freno de intentos (P3-1, P3-3)
        run: python tests/test_seguridad_datos.py

      - name: Reglas Art. 14 y reglamento (headless)
        run: |
          python tests/validar_art14.py
          python tests/validar_reglamento.py

      - name: Motor offline/online sync
        run: python tests/smoke_sync.py

      - name: Notificaciones WebSocket + API
        run: python tests/smoke_alertas.py

      - name: Reconocimiento facial
        run: python tests/smoke_facial.py

      - name: Servidor web (login + página)
        run: |
          timeout 25 python src/web_server.py &
          sleep 6
          curl -fsS http://127.0.0.1:8000/ | grep -q "Sistema de Marcación"
          curl -fsS -X POST http://127.0.0.1:8000/api/login \
            -H "Content-Type: application/json" \
            -d '{"cedula":"admin","password":"admin123"}' | grep -q '"token"'
          # Publicar una alerta sin credenciales debe rechazarse: se difunde a
          # todos los clientes conectados.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/alertas \
            -H "Content-Type: application/json" \
            -d '{"tipo":"ci","severidad":"baja","mensaje":"alerta CI","detalle":""}')
          test "$codigo" = "401" || { echo "esperaba 401, recibí $codigo"; exit 1; }
          # Cabeceras de seguridad presentes en toda respuesta.
          curl -fsSI http://127.0.0.1:8000/ | grep -qi "content-security-policy"

      - name: Kiosco web + Panel de Gestión (RRHH)
        run: |
          timeout 25 python src/web_server.py &
          sleep 6
          WEB_BASE=http://127.0.0.1:8000 python tests/smoke_web_panel.py

      - name: GUI login / cambio de clave / temas (pantalla virtual)
        run: xvfb-run -a python tests/smoke_login.py

      - name: GUI justificaciones / dashboard (pantalla virtual)
        run: xvfb-run -a python tests/smoke_reglamento_gui.py

  deploy:
    name: Construir imagen y desplegar
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t marcacion:latest .

      - name: Publicar en GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag marcacion:latest ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Disparar despliegue en Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"