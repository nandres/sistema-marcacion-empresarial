name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Pruebas (PostgreSQL + GUI virtual)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marcacion_test
          POSTGRES_USER: marcacion
          POSTGRES_PASSWORD: marcacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marcacion -d marcacion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: marcacion_test
      DB_USER: marcacion
      DB_PASSWORD: marcacion
      # Solo para CI. Las tres son obligatorias y exigen 32+ caracteres: sin
      # ellas el proceso aborta en lugar de firmar —o cifrar— con una clave
      # conocida. La biométrica no tiene respaldo a propósito, así que su
      # ausencia no degrada nada: rompe el registro de fotos.
      JWT_SECRET_KEY: clave-de-ci-no-usar-en-produccion
      COMPROBANTE_CLAVE: clave-de-comprobantes-de-ci-no-usar-en-produccion
      BIOMETRIA_CLAVE: clave-biometrica-de-ci-no-usar-en-produccion
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencias del sistema (Tkinter + pantalla virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilación de todos los módulos
        run: python -m py_compile src/*.py

      - name: Aplicar el esquema (base limpia)
        run: |
          python src/migrate.py
          # Sobre una base recién migrada tiene que decir que está al día; si
          # devuelve distinto de cero, el sello no quedó donde debía.
          python src/migrate.py estado

      - name: Script del portal parsea (node --check)
        run: python tests/smoke_portal_js.py

      - name: Motor de liquidación · turnos frontera (Ley 213)
        run: python tests/test_motor_horario.py

      - name: Paleta · contraste WCAG y paridad web/escritorio
        run: xvfb-run -a python tests/test_paleta.py

      - name: Preparar usuarios de prueba
        run: python tests/setup_ci.py

      - name: Antifraude · condición del día declarada por RRHH (P1-1)
        run: python tests/test_condicion_dia.py

      - name: Autoservicio de permisos · ciclo completo y cuota reservada
        run: python tests/smoke_permisos_autoservicio.py

      - name: Formularios automáticos · planilla de extras y constancia
        run: python tests/test_planilla_extras.py

      - name: Turno nocturno y jornadas sin cierre (P2-2, P2-6)
        run: python tests/test_turno_nocturno.py

      - name: Turnos, rotación y jornada partida (P2-4, P2-5)
        run: python tests/test_turnos.py

      - name: Turnos con historia · el pasado usa el horario del pasado
        shell: bash
        run: |
          set -o pipefail
          source tests/servidor.sh
          arrancar
          WEB_BASE=$SERVIDOR python tests/test_turnos_historicos.py
          detener

      - name: Ciclos de rotación automática
        run: python tests/test_rotacion.py

      - name: Cola offline firmada y con techo de reintentos (P3-10)
        run: python tests/test_cola_firmada.py

      - name: Alertas en vivo entre procesos (P3-4)
        run: python tests/test_bus_alertas.py

      - name: Aislamiento entre empresas alojadas
        run: |
          python tests/guardia_arrendamiento.py
          python tests/test_multiempresa.py

      - name: Antigüedad desde el contrato y baja lógica (P3-6)
        run: python tests/test_antiguedad_y_bajas.py

      - name: Biometría cifrada y freno de intentos (P3-1, P3-3)
        run: python tests/test_seguridad_datos.py

      - name: Reglas Art. 14 y reglamento (headless)
        run: |
          python tests/validar_art14.py
          python tests/validar_reglamento.py

      - name: Motor offline/online sync
        run: python tests/smoke_sync.py

      - name: Notificaciones WebSocket + API
        run: python tests/smoke_alertas.py

      - name: Reconocimiento facial
        run: python tests/smoke_facial.py

      - name: Servidor web (login + página)
        # pipefail para que el `grep` de cada comprobación no tape un curl que
        # falló: sin él, el estado del pipe es el del último comando y una
        # respuesta de error con las cabeceras correctas aprueba el paso.
        shell: bash
        run: |
          set -o pipefail
          source tests/servidor.sh
          arrancar
          curl -fsS http://127.0.0.1:8000/ | grep -q "Sistema de Marcación"
          curl -fsS -X POST http://127.0.0.1:8000/api/login \
            -H "Content-Type: application/json" \
            -d '{"cedula":"admin","password":"admin123"}' | grep -q '"token"'
          # Publicar una alerta sin credenciales debe rechazarse: se difunde a
          # todos los clientes conectados.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/alertas \
            -H "Content-Type: application/json" \
            -d '{"tipo":"ci","severidad":"baja","mensaje":"alerta CI","detalle":""}')
          test "$codigo" = "401" || { echo "esperaba 401, recibí $codigo"; exit 1; }
          # Cabeceras de seguridad en la respuesta real: -I manda HEAD y la
          # portada solo sirve GET, así que medía las cabeceras de un 405.
          curl -fsS -D - -o /dev/null http://127.0.0.1:8000/ | grep -qi "content-security-policy"
          detener

      - name: Kiosco web + Panel de Gestión (RRHH)
        shell: bash
        run: |
          set -o pipefail
          source tests/servidor.sh
          arrancar
          WEB_BASE=$SERVIDOR python tests/smoke_web_panel.py
          WEB_BASE=$SERVIDOR python tests/test_sesion_cookie.py
          WEB_BASE=$SERVIDOR python tests/test_dispositivos.py
          detener

      - name: Operacion · registro, salud y version del esquema
        shell: bash
        run: |
          set -o pipefail
          source tests/servidor.sh
          arrancar
          WEB_BASE=$SERVIDOR python tests/test_operacion.py
          # La salud tiene que poder consultarse sin credenciales y decir 200.
          curl -fsS "$SERVIDOR/salud" | grep -q '"estado":"ok"'
          detener

      - name: Pico de marcacion · todos a la vez
        shell: bash
        run: |
          set -o pipefail
          source tests/servidor.sh
          arrancar
          WEB_BASE=$SERVIDOR CARGA_EMPLEADOS=40 python tests/test_carga.py
          detener

      - name: GUI login / cambio de clave / temas (pantalla virtual)
        run: xvfb-run -a python tests/smoke_login.py

      - name: GUI justificaciones / dashboard (pantalla virtual)
        run: xvfb-run -a python tests/smoke_reglamento_gui.py

      # Al final de todo: la restauracion reemplaza el contenido de la base,
      # asi que ningun paso posterior puede depender de lo que quede despues.
      - name: Respaldo y restauracion (viaje redondo)
        shell: bash
        run: |
          set -o pipefail
          # La imagen del runner ya suele traerlas; instalar a ciegas falla
          # cuando el índice de apt está viejo, y actualizarlo siempre cuesta
          # medio minuto por nada.
          command -v pg_dump >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          pg_dump --version
          python tests/test_respaldo.py

  deploy:
    name: Construir imagen y desplegar
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Construir imagen Docker
        run: docker build -t marcacion:latest .

      - name: Publicar en GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag marcacion:latest ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      # El hook viaja por `env` porque `secrets` no existe en las condiciones
      # `if`: nombrarlo ahí no deja el paso en gris, invalida el workflow entero
      # y ninguno de los jobs llega a arrancar.
      - name: Disparar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
